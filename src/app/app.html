<main class="app-shell">
  <div class="topbar">
    <div class="container topbar-container">
      <div class="top-contact">
        <span><i class="fas fa-map-marker-alt"></i> Hann Maristes, Dakar, Sénégal</span>
        <span><i class="fas fa-phone-alt"></i> +221 33 832 29 66 / +221 33 832 11 50</span>
        <span><i class="fas fa-envelope"></i> contact@kikitraiteursenegal.net</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-tag"><i class="fas fa-fire"></i> Depuis 1997</span>
        <div class="top-socials">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="container nav-container">
      <a routerLink="/" class="logo-link">
        <img src="assets/images/logo.png" alt="Kiki Traiteur Logo" class="logo-img">
      </a>

      <button class="nav-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen">
        <i class="fas" [ngClass]="isMenuOpen ? 'fa-times' : 'fa-bars'"></i>
      </button>

      <nav class="nav-links" [class.open]="isMenuOpen">
        @for (item of menu; track item.label) {
          <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.link === '/' }" (click)="closeMenu()">{{ item.label }}</a>
        }
      </nav>
    </div>
  </header>

  <div class="content-panel">
    <router-outlet></router-outlet>
  </div>
</main>

        <section class="dashboard-section active">
          <div class="panel">
            <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
              <h2 class="panel-title">Répertoire Clientèle Kiki Traiteur</h2>
              <button class="btn btn-primary" (click)="openCreateClientModal()">
                <i class="fas fa-plus me-2"></i> Créer un Client
              </button>
            </div>
            <div class="table-responsive">
              <table class="admin-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Nom Client</th>
                    <th>Société</th>
                    <th>E-mail</th>
                    <th>Catégorie</th>
                    <th style="width: 100px;">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let c of getClientsForPage()" style="font-size: 0.8rem;">
                    <td><strong>{{ c.id }}</strong></td>
                    <td>{{ c.name }}</td>
                    <td>{{ c.organization || '-' }}</td>
                    <td>{{ c.email }}</td>
                    <td><span class="badge" style="background:#E2E8F0; color:#334155;">{{ c.organization ? 'Entreprise' : 'Particulier' }}</span></td>
                    <td>
                      <button class="btn btn-sm btn-outline" (click)="openEditClientModal(c)" title="Modifier Client">
                        <i class="fas fa-edit"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>

            <!-- PAGINATION CLIENTS -->
            <div *ngIf="getClientTotalPages() > 1" style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 1.25rem; padding-bottom: 1rem;">
              <button *ngFor="let p of getClientPageArray()" type="button" class="btn btn-sm"
                [style.background]="clientPage === p ? '#7A1C1C' : 'white'"
                [style.color]="clientPage === p ? 'white' : '#64748B'"
                [style.border]="clientPage === p ? '1px solid #7A1C1C' : '1px solid #CBD5E1'"
                style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.85rem; padding: 0; cursor: pointer; transition: all 0.2s;"
                (click)="clientPage = p">
                {{ p }}
              </button>
            </div>
          </div>
        </section>

        <!-- CREATE CLIENT MODAL -->
        <div class="modal-overlay" *ngIf="showCreateClientModal">
          <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
              <h3 class="modal-title">Créer un Nouveau Client</h3>
              <button class="modal-close" (click)="closeCreateClientModal()">&times;</button>
            </div>
            <div class="modal-body">
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div>
                  <label style="display: block; font-weight: 600; font-size: 0.75rem; color: #64748B; margin-bottom: 0.25rem;">NOM DU CLIENT <span style="color: #DC2626;">*</span></label>
                  <input type="text" [(ngModel)]="newClientForm.name" placeholder="Ex: Jane Doe" style="width: 100%; padding: 0.6rem; border: 1px solid #CBD5E1; border-radius: 4px; outline: none;">
                </div>
                <div>
                  <label style="display: block; font-weight: 600; font-size: 0.75rem; color: #64748B; margin-bottom: 0.25rem;">TYPE DE CLIENT <span style="color: #DC2626;">*</span></label>
                  <select [(ngModel)]="newClientForm.type" style="width: 100%; padding: 0.6rem; border: 1px solid #CBD5E1; border-radius: 4px; outline: none; background: white;">
                    <option value="particulier">Particulier</option>
                    <option value="entreprise">Entreprise</option>
                  </select>
                </div>
                <div>
                  <label style="display: block; font-weight: 600; font-size: 0.75rem; color: #64748B; margin-bottom: 0.25rem;">EMAIL <span style="color: #DC2626;">*</span></label>
                  <input type="email" [(ngModel)]="newClientForm.email" placeholder="jane@example.com" style="width: 100%; padding: 0.6rem; border: 1px solid #CBD5E1; border-radius: 4px; outline: none;">
                </div>
                <div>
                  <label style="display: block; font-weight: 600; font-size: 0.75rem; color: #64748B; margin-bottom: 0.25rem;">TÉLÉPHONE</label>
                  <input type="text" [(ngModel)]="newClientForm.phone" placeholder="+221..." style="width: 100%; padding: 0.6rem; border: 1px solid #CBD5E1; border-radius: 4px; outline: none;">
                </div>
                <div *ngIf="newClientForm.type === 'entreprise'" style="grid-column: span 2;">
                  <label style="display: block; font-weight: 600; font-size: 0.75rem; color: #64748B; margin-bottom: 0.25rem;">NOM DE L'ENTREPRISE <span style="color: #DC2626;">*</span></label>
                  <input type="text" [(ngModel)]="newClientForm.organization" placeholder="Ex: Kiki Traiteur SAS" style="width: 100%; padding: 0.6rem; border: 1px solid #CBD5E1; border-radius: 4px; outline: none;">
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" (click)="closeCreateClientModal()" [disabled]="isCreating">Annuler</button>
              <button class="btn btn-primary" (click)="submitCreateClient()" [disabled]="isCreating || !newClientForm.name || !newClientForm.email || (newClientForm.type === 'entreprise' && !newClientForm.organization)" style="position: relative; min-width: 120px;">
                <span [style.opacity]="isCreating ? '0' : '1'">Enregistrer</span>
                <i *ngIf="isCreating" class="fas fa-spinner fa-spin" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);"></i>
              </button>
            </div>
          </div>
        </div>
